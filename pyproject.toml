[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-me-skill"
version = "1.0.0"
description = "Distil your chat history, diaries and photos into a runnable digital self (Self Memory + Persona)."
readme = "README.md"
authors = [{ name = "xsoway" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["skill", "self", "persona", "claude-code", "distil"]
dependencies = [
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.data-files]
# 把 Skill 契约载荷（SKILL.md、prompts、agents、evals、scripts、references、examples）
# 打进 wheel，保证 pip install 后能拿到完整 Skill 内容，而不只是 tools 包。
"echo-me-skill" = [
    "SKILL.md",
    "AGENTS.md",
    "CLAUDE.md",
    "prompts/*.md",
    "agents/*.yaml",
    "evals/*.yaml",
    "evals/cases/*.yaml",
    "scripts/*.py",
    "references/*.md",
    "examples/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP009：工作区 AGENTS.md 强制要求保留 `# -*- coding: utf-8 -*-` 文件头，故忽略该告警
ignore = ["UP009"]